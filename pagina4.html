<body>
    <h1>SOLICITA TU BECA</h1>
    <h1>Para solicitar tu beca rellena el siguiente formulario para aplicar a una beca</h1>
    <div class="formulario">
    <form action="/my-handling-form-page" method="post">
  <ul>
    <li>
      <label for="name">Nombre:</label>
      <input type="text" id="name" name="user_name" />
    </li>
    <li>¬
      <label for="mail">Correo electrónico:</label>
      <input type="email" id="mail" name="user_mail" />
    </li>
    <li>
      <label for="msg">Mensaje:</label>
      <textarea id="msg" name="user_message"></textarea>
    </li>
  </ul>
  <label for="datepicker" class="form-label">Fecha de nacimiento</label>
<input type="text" class="form-control w-12" id="datepicker1" data-bs-toggle="datepicker" autocomplete="off" placeholder="Elige la fecha…">
<div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">Selecciona la beca</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Selecciona para que beca quieres aplicar…</option>
    <option value="1">Apoyo economico</option>
    <option value="2">Acceso tecnologico</option>
    <option value="3">Regularizacion academica</option>
  </select>
</div>
<div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">Genero</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Selecciona tu genero…</option>
    <option value="1">Femenino</option>
    <option value="2">Maculino</option>
    <option value="3">Otro...</option>
  </select> 
</div>
<div class="form-field">
  <label for="exampleFormControlSelect2" class="form-label">Selecciona tu nivel de estudio</label>
  <select class="form-control" id="exampleFormControlSelect2">
    <option>Nivel de estudio</option>
    <option value="1">primaria</option>
    <option value="2">secundaria</option>
    <option value="3">medio-superior</option>
    <option value="3">universidad</option>
  </select>
</div>
</form>
</div>
